# Nginx — proxy reverso para o Painel Unitv (porta 3000)
#
# Instalação no servidor (troque seudominio.com pelo seu domínio):
#   sudo cp deploy/nginx-painel.conf /etc/nginx/sites-available/painel
#   sudo ln -s /etc/nginx/sites-available/painel /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/painel   # ajustar server_name
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d seudominio.com -d www.seudominio.com   # adiciona HTTPS sozinho

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com www.seudominio.com;

    client_max_body_size 5M;

    # SSE (/api/user/events) — notificações em tempo real.
    # Precisa de buffering desativado, senão as notificações não chegam ao navegador.
    location = /api/user/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Resto da aplicação
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
